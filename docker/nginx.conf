# The image's built-in web server: serves public/ on port 80 and passes PHP to PHP-FPM in the same container.
# Mount extra server blocks into /etc/nginx/conf.d/ to serve more, such as the mod repository.
server {
    listen 80 default_server;

    root /var/www/html/public;
    index index.php;

    # PHP's upload_max_filesize and post_max_size decide how large an upload can be
    client_max_body_size 0;
    fastcgi_read_timeout 3600s;
    fastcgi_send_timeout 3600s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
