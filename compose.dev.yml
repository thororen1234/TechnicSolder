# Development stack owned by the technicsolder-dev Compose project. Run it on its own; do NOT merge with compose.yml:
#   docker compose -f compose.dev.yml up -d
# Combining the two files (-f compose.yml -f compose.dev.yml) pulls in the
# production MariaDB service and its env-injection block, which breaks the
# postgres dev database and test isolation.
name: technicsolder-dev

services:
  nginx:
    image: nginx:1.31.6@sha256:60f0d4e986561e08804f75c211dcaf7fc5455699eada29f42cbe8a0a7253dd86
    depends_on:
      - solder
    ports:
      - "8080:80"
    volumes:
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Installs dependencies, migrates, rebuilds the frontend on change and restarts the server on change
  solder:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Background jobs (modpack imports, exports, update checks), restarted when the code changes
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    depends_on:
      - solder
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "until [ -f .env ] && [ -d src/generated/prisma/postgresql ]; do sleep 2; done; exec pnpm exec tsx watch src/worker.ts"]

  # Scheduled tasks such as the nightly mod update check
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    depends_on:
      - solder
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "until [ -f .env ] && [ -d src/generated/prisma/postgresql ]; do sleep 2; done; exec pnpm exec tsx watch src/scheduler.ts"]

  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    # Reachable from the host (for running the app or tests outside Docker) but not from the LAN
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE:-solder}
      - POSTGRES_USER=${DB_USERNAME:-solder}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-solder}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
    # Reachable from the host but not from the LAN
    ports:
      - "127.0.0.1:6381:6379"

volumes:
  postgres_data:
  node_modules:
